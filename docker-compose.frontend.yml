
# Frontend development configuration
# Usage: docker-compose -f docker-compose.frontend.yml up -d
#
# Note: Backend must be running first (docker-compose up -d)
# Frontend connects to backend via host network

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* are baked into the browser bundle at build time, so a
        # runtime `environment:` entry cannot change them — after editing these
        # you must rebuild: docker compose -f docker-compose.frontend.yml build
        # --no-cache frontend. They must point at an address the BROWSER can
        # reach; the defaults assume the browser runs on the Docker host. When
        # you open the app from another machine, set PUBLIC_HOST to this host's
        # address (e.g. PUBLIC_HOST=10.0.0.5) or override each URL directly.
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://${PUBLIC_HOST:-localhost}:8000}
        - NEXT_PUBLIC_WS_URL=${NEXT_PUBLIC_WS_URL:-ws://${PUBLIC_HOST:-localhost}:8000}
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://${PUBLIC_HOST:-localhost}:3000}
        - NEXT_PUBLIC_MAX_UPLOAD_SIZE_MB=50
        - NEXT_PUBLIC_RAG_ENABLED=true
        # The LAN deployment is plain HTTP. This must be available during the
        # Next.js build, otherwise auth route handlers bake in Secure cookies
        # which browsers reject on http://192.168.x.x.
        - COOKIE_SECURE=${COOKIE_SECURE:-false}
    container_name: academic_research_agent_frontend
    ports:
      - "${FRONTEND_EXPOSE_PORT:-3000}:3000"
    environment:
      - NODE_ENV=development
      - COOKIE_SECURE=${COOKIE_SECURE:-false}
      # Server-side only: resolved inside this container, never by the browser.
      - BACKEND_URL=${BACKEND_URL:-http://app:8000}
    networks: [backend]
    depends_on:
      app:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      # The oven/bun image has no curl/wget, so probe with bun's built-in fetch.
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

networks:
  backend:
    driver: bridge
