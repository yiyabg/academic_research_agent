# Production topology for the academic research system.
#
# This file is intentionally standalone. Do not combine it with development
# compose files: production uses immutable image contents, authenticated Redis,
# private data services, split research queues, and migration/init gates.
#
# Usage:
#   docker compose --env-file backend/.env -f docker-compose.prod.yml config --quiet
#   docker compose --env-file backend/.env -f docker-compose.prod.yml up -d --build --wait

x-backend-environment: &backend-environment
  DEBUG: "false"
  ENVIRONMENT: production
  LOGFIRE_ENVIRONMENT: production
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required}
  API_KEY: ${API_KEY:?API_KEY is required}
  POSTGRES_HOST: db
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
  POSTGRES_DB: ${POSTGRES_DB:-academic_research_agent}
  REDIS_HOST: redis
  REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
  QDRANT_HOST: qdrant
  QDRANT_PORT: "6333"
  CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
  CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
  S3_BUCKET: ${S3_BUCKET:-academic-research}
  GROBID_URL: http://grobid:8070
  CLAMAV_HOST: clamav
  CLAMAV_PORT: "3310"
  PROMETHEUS_AUTH_TOKEN: ${PROMETHEUS_AUTH_TOKEN:?PROMETHEUS_AUTH_TOKEN is required}
  LLM_PROVIDER: ${LLM_PROVIDER:-openai}
  LLM_BASE_URL: ${LLM_BASE_URL:-}
  AI_MODEL: ${AI_MODEL:-gpt-5.5}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  HTTPS_PROXY: ${RUNTIME_HTTPS_PROXY:-}
  NO_PROXY: ${RUNTIME_NO_PROXY:-localhost,127.0.0.1,db,redis,qdrant,minio,grobid,clamav}

x-research-worker: &research-worker
  image: academic_research_agent_backend:${APP_IMAGE_TAG:-production}
  pull_policy: never
  env_file: [./backend/.env]
  environment:
    <<: *backend-environment
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    MODELS_CACHE_DIR: /app/models_cache
  networks: [backend]
  extra_hosts:
    - "host.docker.internal:host-gateway"
    # Optional, project-scoped DNS override for an LLM gateway. The inert
    # defaults keep ordinary OpenAI/DeepSeek deployments unchanged.
    - "${LLM_GATEWAY_HOST:-llm-gateway.invalid}:${LLM_GATEWAY_HOST_IP:-127.0.0.1}"
  restart: unless-stopped
  healthcheck: {disable: true}

services:
  config-check:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: academic_research_agent_backend:${APP_IMAGE_TAG:-production}
    pull_policy: never
    command:
      - python
      - -c
      - "from app.core.config import settings; print(f'production_config_ok:{settings.PROJECT_NAME}')"
    env_file: [./backend/.env]
    environment: *backend-environment
    networks: [backend]
    restart: "no"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-academic_research_agent}
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "2", memory: 2G}

  redis:
    image: redis:7-alpine
    command:
      - sh
      - -c
      - 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"'
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes: [redis_data:/data]
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "1", memory: 1G}

  qdrant:
    image: qdrant/qdrant:v1.18.3
    volumes: [qdrant_data:/qdrant/storage]
    networks: [backend]
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "2", memory: 2G}

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes: [minio_data:/data]
    networks: [backend]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "2", memory: 2G}

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    entrypoint: /bin/sh
    command:
      - -c
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" &&
        mc mb --ignore-existing "local/$${S3_BUCKET}" &&
        mc anonymous set none "local/$${S3_BUCKET}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      S3_BUCKET: ${S3_BUCKET:-academic-research}
    networks: [backend]
    depends_on:
      minio: {condition: service_healthy}
    restart: "no"

  grobid:
    image: lfoppiano/grobid:0.8.2
    environment:
      JAVA_TOOL_OPTIONS: -XX:-UseContainerSupport -Xms512m -Xmx4g
    networks: [backend]
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8070"]
      interval: 20s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "4", memory: 5G}

  clamav:
    image: clamav/clamav:1.4
    volumes: [clamav_data:/var/lib/clamav]
    networks: [backend]
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 30
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        limits: {cpus: "2", memory: 3G}

  migrate:
    <<: *research-worker
    command: alembic upgrade head
    environment: *backend-environment
    volumes: []
    depends_on:
      config-check: {condition: service_completed_successfully}
      db: {condition: service_healthy}
    restart: "no"

  model-init:
    image: academic_research_agent_backend:${APP_IMAGE_TAG:-production}
    pull_policy: never
    command: python /app/scripts/preload_research_models.py
    env_file: [./backend/.env]
    environment:
      <<: *backend-environment
      MODELS_CACHE_DIR: /app/models_cache
      HTTP_PROXY: ${MODEL_DOWNLOAD_HTTP_PROXY:-}
      HTTPS_PROXY: ${MODEL_DOWNLOAD_HTTP_PROXY:-}
      ALL_PROXY: ${MODEL_DOWNLOAD_HTTP_PROXY:-}
    volumes: [models_cache:/app/models_cache]
    # Host networking is intentional for this one-shot initializer: on managed
    # hosts MODEL_DOWNLOAD_HTTP_PROXY commonly points to a loopback proxy.
    # Runtime services use the separate, optional RUNTIME_HTTPS_PROXY setting.
    network_mode: host
    depends_on:
      config-check: {condition: service_completed_successfully}
    restart: "no"
    healthcheck: {disable: true}

  app:
    <<: *research-worker
    environment:
      <<: *backend-environment
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      MODELS_CACHE_DIR: /app/models_cache
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus-multiproc
    command:
      - sh
      - -c
      - >-
        rm -rf "$${PROMETHEUS_MULTIPROC_DIR}" &&
        mkdir -p "$${PROMETHEUS_MULTIPROC_DIR}" &&
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000
        --workers ${BACKEND_WORKERS:-4} --ws websockets-sansio
    volumes:
      - media_data:/app/media
      - models_cache:/app/models_cache
    ports: ["${BACKEND_EXPOSE_PORT:-8000}:8000"]
    labels:
      - prometheus.scrape=true
      - prometheus.port=8000
      - prometheus.path=/metrics
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      qdrant: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
      grobid: {condition: service_healthy}
      clamav: {condition: service_healthy}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import httpx; raise SystemExit(0 if httpx.get('http://127.0.0.1:8000/api/v1/health').is_success else 1)"
      interval: 15s
      timeout: 10s
      start_period: 20s
      retries: 20
    deploy:
      resources:
        limits: {cpus: "4", memory: 4G}
        reservations: {cpus: "1", memory: 1G}

  research-worker-io:
    <<: *research-worker
    command: >-
      celery -A app.worker.celery_app worker --loglevel=info
      -Q research-io --concurrency=${RESEARCH_IO_CONCURRENCY:-8}
    volumes: [media_data:/app/media]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
      clamav: {condition: service_healthy}

  research-worker-cpu:
    <<: *research-worker
    command: >-
      celery -A app.worker.celery_app worker --loglevel=info
      -Q research-cpu --pool=solo --concurrency=1
    volumes:
      - media_data:/app/media
      - models_cache:/app/models_cache
    depends_on:
      migrate: {condition: service_completed_successfully}
      model-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
      grobid: {condition: service_healthy}
    deploy:
      resources:
        limits: {cpus: "8", memory: 8G}

  research-worker-llm:
    <<: *research-worker
    command: >-
      celery -A app.worker.celery_app worker --loglevel=info
      -Q research-llm,paper-analysis --concurrency=${RESEARCH_LLM_CONCURRENCY:-4}
    volumes: [models_cache:/app/models_cache]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  celery-beat:
    <<: *research-worker
    command: celery -A app.worker.celery_app beat --loglevel=info
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  flower:
    <<: *research-worker
    command: celery -A app.worker.celery_app flower --port=5555
    environment:
      <<: *backend-environment
      FLOWER_BASIC_AUTH: ${FLOWER_USER:-admin}:${FLOWER_PASSWORD:?FLOWER_PASSWORD is required}
    ports: ["${FLOWER_EXPOSE_PORT:-5555}:5555"]
    depends_on:
      redis: {condition: service_healthy}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.${DOMAIN:?DOMAIN is required}}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-wss://api.${DOMAIN:?DOMAIN is required}}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://${DOMAIN:?DOMAIN is required}}
        NEXT_PUBLIC_MAX_UPLOAD_SIZE_MB: ${NEXT_PUBLIC_MAX_UPLOAD_SIZE_MB:-50}
        NEXT_PUBLIC_RAG_ENABLED: "true"
        COOKIE_SECURE: ${COOKIE_SECURE:-true}
    environment:
      NODE_ENV: production
      BACKEND_URL: http://app:8000
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    networks: [backend]
    ports: ["${FRONTEND_EXPOSE_PORT:-3000}:3000"]
    depends_on:
      app: {condition: service_healthy}
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 5
    deploy:
      resources:
        limits: {cpus: "2", memory: 2G}

networks:
  # Outbound HTTPS is required by scholarly adapters and the LLM worker. Data
  # services remain private because only app/frontend/flower publish ports.
  backend:
    driver: bridge

volumes:
  media_data:
  postgres_data:
  redis_data:
  qdrant_data:
  minio_data:
  models_cache:
  clamav_data:
