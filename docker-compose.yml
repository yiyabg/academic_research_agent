
# Backend development configuration
# Usage: docker-compose up -d

services:
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
      network: host
    image: academic_research_agent_backend:dev
    container_name: academic_research_agent_backend
    ports:
      - "${BACKEND_EXPOSE_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app:ro
      - ./backend/cli:/app/cli:ro
      - media_data:/app/media
      - models_cache:/app/models_cache
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=true
      - ENVIRONMENT=local
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    # --ws websockets-sansio: uvicorn's `auto` picks the legacy websockets impl,
    # which is broken with websockets >=14 (handshake → HTTP 500). The sansio
    # implementation is the modern, compatible one. Required for the chat WS.
    # A reload must not wait forever for an idle SSE/WebSocket connection. All
    # research progress events are replayable from PostgreSQL, so closing a
    # socket after this grace period is safe: the browser reconnects with its
    # last sequence number and receives anything it missed.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --ws websockets-sansio --timeout-graceful-shutdown 10
    networks:
      - backend
    # Optional, explicit gateway mapping.  This avoids relying on container DNS
    # when an enterprise proxy is intentionally pinned to a known address.
    # The default is inert for normal OpenAI-compatible deployments.
    extra_hosts:
      - "${LLM_GATEWAY_HOST:-llm-gateway.invalid}:${LLM_GATEWAY_HOST_IP:-127.0.0.1}"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - "prometheus.scrape=true"
      - "prometheus.port=8000"
      - "prometheus.path=/metrics"


  db:
    image: postgres:16-alpine
    container_name: academic_research_agent_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-academic_research_agent}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Port exposed only for local development - remove in production
    ports:
      - "${POSTGRES_EXPOSE_PORT:-5432}:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: academic_research_agent_redis
    # Port exposed only for local development - remove in production
    ports:
      - "${REDIS_EXPOSE_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.18.3
    container_name: academic_research_agent_qdrant
    ports:
      - "${QDRANT_HTTP_EXPOSE_PORT:-6333}:6333"
      - "${QDRANT_GRPC_EXPOSE_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - backend
    healthcheck:
      # The upstream Qdrant image does not ship curl/wget. Bash TCP probing
      # verifies that the REST listener is accepting connections.
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  celery_worker:
    image: academic_research_agent_backend:dev
    pull_policy: never
    container_name: academic_research_agent_celery_worker
    volumes:
      - ./backend/app:/app/app:ro
      - media_data:/app/media
      - models_cache:/app/models_cache
    command: celery -A app.worker.celery_app worker --loglevel=debug -Q celery,research-io,research-cpu,research-llm,paper-analysis
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=true
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - backend
    extra_hosts:
      - "${LLM_GATEWAY_HOST:-llm-gateway.invalid}:${LLM_GATEWAY_HOST_IP:-127.0.0.1}"
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true

  celery_beat:
    image: academic_research_agent_backend:dev
    pull_policy: never
    container_name: academic_research_agent_celery_beat
    volumes:
      - ./backend/app:/app/app:ro
    command: celery -A app.worker.celery_app beat --loglevel=debug
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=true
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - backend
    extra_hosts:
      - "${LLM_GATEWAY_HOST:-llm-gateway.invalid}:${LLM_GATEWAY_HOST_IP:-127.0.0.1}"
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true

  flower:
    image: academic_research_agent_backend:dev
    pull_policy: never
    container_name: academic_research_agent_flower
    command: celery -A app.worker.celery_app flower --port=5555
    ports:
      - "${FLOWER_EXPOSE_PORT:-5555}:5555"
    env_file:
      - ./backend/.env
    environment:
      - DEBUG=true
      - REDIS_HOST=redis
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    networks:
      - backend
    depends_on:
      app:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      disable: true

networks:
  backend:
    driver: bridge

volumes:
  media_data:
  postgres_data:
  redis_data:
  qdrant_data:
  models_cache:
